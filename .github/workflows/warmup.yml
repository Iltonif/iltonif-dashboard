name: Calentar dashboard

# Despierta la app de Streamlit Cloud tras el redespliegue que provoca
# el push diario del pipeline, para que la primera visita real no
# sufra el arranque en frío (1-2 min).

on:
  workflow_run:
    workflows: ["Actualizar dataset diario"]
    types: [completed]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Esperar al redespliegue de Streamlit Cloud
        run: sleep 90

      - name: Ping con reintentos
        run: |
          # Presupuesto ampliado: los días en que el pipeline cambia
          # requirements.txt (o Streamlit Cloud reinstala dependencias
          # desde cero), el arranque puede superar los ~6 min que había
          # antes. Ahora hay margen de hasta ~20 min antes de darse por
          # vencido.
          URL="https://iltonif-intelligence.streamlit.app/"
          intentos=15
          espera=60
          for i in $(seq 1 $intentos); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$URL")
            echo "Intento $i/$intentos: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Dashboard despierto."
              exit 0
            fi
            if [ "$i" -lt "$intentos" ]; then
              sleep $espera
            fi
          done
          echo "::error::El dashboard no respondió tras $intentos intentos (~20 min) — revisar Streamlit Cloud"
          exit 1
